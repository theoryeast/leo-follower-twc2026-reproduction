name: validate

on:
  push:
  pull_request:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile src/leo_follower_model.py src/interference_model.py src/sinr_model.py src/deployment_optimization_model.py src/reproduce_figures.py src/reproduce_interference_figures.py src/reproduce_sinr_figures.py src/reproduce_deployment_figures.py src/qa_sinr.py src/qa_deployment.py src/qa_d2_stability.py
      - run: python -m unittest discover -s tests -v
      - run: python src/qa_sinr.py
      - run: python src/qa_deployment.py
